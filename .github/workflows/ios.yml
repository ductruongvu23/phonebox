name: iOS

# Builds the iPhone app (.ipa for TrollStore) and the rootless jailbreak package (.deb) with plain clang on Linux.
# Tag ios-v* to publish a GitHub Release with the .ipa, the .deb and their checksums.
# (The Sileo/Zebra repo with the .deb lives in ductruongvu23/repo, not here.)
on:
  push:
    branches: [ios]
    paths: ['ios/**', 'android/app/src/main/assets/www/**', '.github/workflows/ios.yml']
    tags: ['ios-v*']
  pull_request:
    paths: ['ios/**', 'android/app/src/main/assets/www/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (clang, lld, iPhoneOS SDK, ldid)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld zip python3
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/sdks"
          echo "SDK=$HOME/sdks/iPhoneOS15.6.sdk" >> "$GITHUB_ENV"
          curl -fsSL -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          # TODO: pin the ldid release by SHA-256
          chmod +x ldid && sudo mv ldid /usr/local/bin/ldid

      - name: Build .ipa and .deb
        run: ios/scripts/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: phonebox-ios
          path: |
            ios/build/PhoneBox.ipa
            ios/build/*.deb

  # The desktop agent with the iPhone USB support (IosUsb), self-contained, for the release. Same build as the upstream release
  # workflow, but UNSIGNED: no SignPath or macOS certificate here, so Windows SmartScreen warns and a Mac asks for the
  # Accessibility permission again after each update.
  agent:
    if: startsWith(github.ref, 'refs/tags/ios-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, tfm: net10.0-windows10.0.19041.0 }
          - { os: ubuntu-latest, rid: linux-x64, tfm: net10.0 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, tfm: net10.0 }
          - { os: macos-latest, rid: osx-arm64, tfm: net10.0 }
          - { os: macos-15-intel, rid: osx-x64, tfm: net10.0 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' agent/PhoneBox.Agent/PhoneBox.Agent.csproj | head -1)" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: dotnet test agent/PhoneBox.Agent.Tests --nologo
      - name: Publish (self-contained, single file)
        run: dotnet publish agent/PhoneBox.Agent -c Release -f ${{ matrix.tfm }} -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o out --nologo
      - name: Smoke-test the published agent
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { 'out/PhoneBoxAgent.exe' } else { 'out/PhoneBoxAgent' }
          python tools/smoke-agent.py $exe --version '${{ steps.v.outputs.version }}'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out/* -DestinationPath "dist/PhoneBoxAgent-ios-${{ steps.v.outputs.version }}-${{ matrix.rid }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-agent-${{ matrix.rid }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/ios-v')
    needs: [build, agent]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phonebox-ios
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: release-agent-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && find . -type f \( -name '*.ipa' -o -name '*.deb' -o -name '*.zip' \) -exec sha256sum {} + > SHA256SUMS.txt
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "PhoneBox for iOS ${GITHUB_REF_NAME#ios-v}" --notes "iPhone app (.ipa, TrollStore), rootless jailbreak package (.deb, Sileo/Zebra) and the desktop agent with iPhone USB support (PhoneBoxAgent-ios-*.zip for Windows, macOS and Linux; unsigned builds)." $(find dist -type f)
