name: iOS

# Builds the iPhone app (.ipa for TrollStore) and the rootless jailbreak package (.deb) with plain clang on Linux.
# Tag ios-v* to publish a GitHub Release and refresh the APT repo on the gh-pages branch.
on:
  push:
    branches: [ios]
    paths: ['ios/**', 'android/app/src/main/assets/www/**', '.github/workflows/ios.yml']
    tags: ['ios-v*']
  pull_request:
    paths: ['ios/**', 'android/app/src/main/assets/www/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (clang, lld, iPhoneOS SDK, ldid)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld zip python3
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/sdks"
          echo "SDK=$HOME/sdks/iPhoneOS15.6.sdk" >> "$GITHUB_ENV"
          curl -fsSL -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          # TODO: pin the ldid release by SHA-256
          chmod +x ldid && sudo mv ldid /usr/local/bin/ldid

      - name: Build .ipa and .deb
        run: ios/scripts/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: phonebox-ios
          path: |
            ios/build/PhoneBox.ipa
            ios/build/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/ios-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phonebox-ios
          path: dist
      - name: Checksums
        run: cd dist && find . -type f \( -name '*.ipa' -o -name '*.deb' \) -exec sha256sum {} + > SHA256SUMS.txt
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "PhoneBox for iOS ${GITHUB_REF_NAME#ios-v}" --notes "iPhone app (.ipa, TrollStore) and rootless jailbreak package (.deb, Sileo/Zebra)." $(find dist -type f)
      - name: APT repo
        run: |
          python3 ios/scripts/make-apt-repo.py dist /tmp/apt
          git fetch origin gh-pages:gh-pages || git checkout --orphan gh-pages
          git switch gh-pages 2>/dev/null || true
          mkdir -p ios-apt && cp -R /tmp/apt/. ios-apt/
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add ios-apt && git commit -m "iOS APT repo ${GITHUB_REF_NAME}" && git push origin gh-pages
